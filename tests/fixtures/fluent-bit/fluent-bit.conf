[SERVICE]
    Flush         1
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     ${FB_HTTP_PORT}

[INPUT]
    Name              tail
    Tag               test.file
    Path              /var/log/containers/*.log
    DB                /var/lib/fluent-bit/tail.db
    Read_from_Head    On
    Refresh_Interval  1

[OUTPUT]
    Name         loki
    Match        test.*
    Host         ${LOKI_HOST}
    Port         ${LOKI_PORT}
    URI          ${LOKI_URI}
    tls          ${LOKI_TLS}
    Labels       job=wbtest
    Line_Format  json
    Retry_Limit  False
