# uv run pre-commit run --all-files
# The ruff rev must equal the ruff pin in pyproject.toml.
fail_fast: false

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: uv run --frozen --all-groups basedpyright
        language: system
        pass_filenames: false
        types: [python]
      - id: ansible-lint
        name: ansible-lint
        entry: uv run --frozen --all-groups ansible-lint
        language: system
        pass_filenames: false
        files: \.(ya?ml)$
        exclude: ^(\.github/|\.pre-commit-config\.yaml|uv\.lock)

  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^supervisor/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        exclude: ^chart/templates/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: end-of-file-fixer
        exclude: ^\.superpowers/
      - id: trailing-whitespace
        exclude: (\.md$|^\.superpowers/)
      - id: mixed-line-ending
        args: [--fix=lf]
