---
- name: Check the required config
  ansible.builtin.assert:
    that:
      - instance.config.script is defined
      - instance.config.output_dir is defined
    fail_msg: "instance {{ instance.name }}: loadgen needs config.script and config.output_dir"
    quiet: true

- name: Create the scripts dir
  ansible.builtin.file:
    path: "/tmp/wb-{{ instance.name }}/scripts"
    state: directory
    mode: "0755"

- name: Install the bundled script
  ansible.builtin.copy:
    src: "scripts/{{ instance.config.script }}"
    dest: "/tmp/wb-{{ instance.name }}/scripts/{{ instance.config.script }}"
    mode: "0644"

- name: Create the output dir when missing
  ansible.builtin.include_role:
    name: nanofaas.workbench.common
    tasks_from: ensure_dir
  vars:
    wb_dir: "{{ instance.config.output_dir }}"
    wb_mode: "0755"

# k6 runs as the invoking user by default so its output files belong to the caller.
- name: Look up the remote user's uid and gid
  ansible.builtin.include_role:
    name: nanofaas.workbench.common
    tasks_from: caller_ids
  when: instance.config.user is not defined

- name: Work out the command line
  ansible.builtin.set_fact:
    loadgen_command: >-
      exec k6 run --quiet --log-format=json --log-output=file=/out/generator.jsonl
      /scripts/{{ instance.config.script }} 2>/out/generator.stderr
    loadgen_user: >-
      {{ instance.config.user if instance.config.user is defined
         else common_caller_ids }}
    # An arbitrary uid has no home in the image.
    loadgen_env: "{{ {'HOME': '/tmp'} | combine(instance.config.env | default({})) }}"

# One meaning in both forms: a job still running is left alone, one that already finished
# is refused (rerunning it would duplicate load and evidence), only a missing one starts.
- name: Run k6 (pod form)
  when: (instance.form | default('container')) == 'pod'
  block:
    - name: Read the Job's status
      ansible.builtin.command:
        argv: >-
          {{ ['kubectl'] + (['--kubeconfig', instance.config.kubeconfig] if instance.config.kubeconfig is defined else [])
             + ['-n', instance.config.namespace | default('default'), 'get', 'job', 'wb-' ~ instance.name,
                '--ignore-not-found', '-o', 'jsonpath={.status.active}/{.status.succeeded}/{.status.failed}'] }}
      register: loadgen_job_prior
      changed_when: false

    - name: Refuse a Job that already ran
      ansible.builtin.fail:
        msg: "loadgen {{ instance.name }} already ran; undeploy it first"
      when: >-
        loadgen_job_prior.stdout | trim != '' and
        (loadgen_job_prior.stdout.split('/')[1] | default('') not in ['', '0']
         or loadgen_job_prior.stdout.split('/')[2] | default('') not in ['', '0'])

    - name: Install the Job
      when: loadgen_job_prior.stdout | trim == ''
      ansible.builtin.include_role:
        name: nanofaas.workbench.common
        tasks_from: pod_deploy
      vars:
        wb_key: loadgen
        wb_files_dir: "/tmp/wb-{{ instance.name }}/scripts"
        wb_files: ["{{ instance.config.script }}"]
        # A Job is not "ready": its status is polled below.
        wb_wait: false
        wb_values:
          image: "{{ loadgen_image }}"
          args: ["{{ loadgen_command }}"]
          env: "{{ loadgen_env }}"
          output_dir: "{{ instance.config.output_dir }}"
          mounts: "{{ instance.config.mounts | default({}) }}"
          user: "{{ loadgen_user }}"

    - name: Wait for the job to have started
      when: loadgen_job_prior.stdout | trim == ''
      ansible.builtin.command:
        argv: >-
          {{ ['kubectl'] + (['--kubeconfig', instance.config.kubeconfig] if instance.config.kubeconfig is defined else [])
             + ['-n', instance.config.namespace | default('default'), 'get', 'job', 'wb-' ~ instance.name,
                '-o', 'jsonpath={.status.active}/{.status.succeeded}/{.status.failed}'] }}
      register: loadgen_job
      until: loadgen_job.stdout != '//'
      retries: 60
      delay: 2
      changed_when: false

    - name: Fail fast when k6 failed
      when: loadgen_job_prior.stdout | trim == ''
      ansible.builtin.assert:
        that: loadgen_job.stdout.split('/')[2] == ''
        fail_msg: "instance {{ instance.name }}: the k6 Job failed; see generator.stderr in output_dir"
        quiet: true

- name: Run k6 (container form)
  when: (instance.form | default('container')) == 'container'
  block:
    - name: Look the container up
      community.docker.docker_container_info:
        name: "wb-{{ instance.name }}"
      register: loadgen_container_prior

    - name: Refuse a job that already ran
      ansible.builtin.fail:
        msg: "loadgen {{ instance.name }} already ran; undeploy it first"
      when:
        - loadgen_container_prior.exists
        - loadgen_container_prior.container.State.Status != 'created'
        - not loadgen_container_prior.container.State.Running

    # A container that was created but never started has not run yet.
    - name: Start k6
      when: >-
        not loadgen_container_prior.exists
        or loadgen_container_prior.container.State.Status == 'created'
      ansible.builtin.include_role:
        name: nanofaas.workbench.common
        tasks_from: container_deploy
      vars:
        wb_image: "{{ loadgen_image }}"
        # Host network: schedules use loopback URLs.
        wb_network_mode: "{{ instance.config.network | default('host') }}"
        wb_restart_policy: "no"
        wb_user: "{{ loadgen_user }}"
        wb_entrypoint: [sh, -c]
        wb_command: ["{{ loadgen_command }}"]
        wb_env: "{{ loadgen_env }}"
        # Caller mounts are read-only; only the output dir is writable.
        wb_volumes: >-
          {{ ['/tmp/wb-' ~ instance.name ~ '/scripts:/scripts:ro', instance.config.output_dir ~ ':/out']
             + (instance.config.mounts | default({}) | dict2items
                | map(attribute='key') | zip(instance.config.mounts | default({}) | dict2items | map(attribute='value'))
                | map('join', ':') | map('regex_replace', '$', ':ro') | list) }}

    # A job has no port: it counts as started when it runs or has already exited 0.
    - name: Wait for the job to have started
      when: not loadgen_container_prior.exists
      community.docker.docker_container_info:
        name: "wb-{{ instance.name }}"
      register: loadgen_state
      until: >-
        loadgen_state.container.State.Running or
        loadgen_state.container.State.Status == 'exited'
      retries: 30
      delay: 1

    - name: Fail fast when k6 exited non-zero
      when: not loadgen_container_prior.exists
      ansible.builtin.assert:
        that: loadgen_state.container.State.ExitCode == 0
        fail_msg: "instance {{ instance.name }}: k6 exited {{ loadgen_state.container.State.ExitCode }}; see generator.stderr in output_dir"
        quiet: true
