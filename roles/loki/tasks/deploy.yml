---
- name: Check the required config
  ansible.builtin.assert:
    that:
      - instance.config.port is defined
      - instance.config.data_dir is defined
    fail_msg: "instance {{ instance.name }}: loki needs config.port and config.data_dir"
    quiet: true

- name: Create the config dir
  ansible.builtin.file:
    path: "/tmp/wb-{{ instance.name }}"
    state: directory
    mode: "0755"

# Both forms use this file: a bind mount (container) or the ConfigMap's content (pod).
- name: Place the config file
  register: loki_config
  ansible.builtin.copy:
    src: "{{ instance.config.config_file | default('loki.yaml') }}"
    dest: "/tmp/wb-{{ instance.name }}/loki.yaml"
    mode: "0644"

- name: Run Loki (pod form)
  when: (instance.form | default('container')) == 'pod'
  ansible.builtin.include_role:
    name: nanofaas.workbench.common
    tasks_from: pod_deploy
  vars:
    wb_key: loki
    wb_files: [loki.yaml]
    wb_values:
      image: "{{ loki_image }}"
      args: [-config.file=/etc/loki/loki.yaml]
      port: "{{ instance.config.port }}"

- name: Run Loki (container form)
  when: (instance.form | default('container')) == 'container'
  block:

    # ponytail: 0777 because Loki runs as uid 10001; the caller still owns the path.
    - name: Create the data dir
      ansible.builtin.file:
        path: "{{ instance.config.data_dir }}"
        state: directory
        mode: "0777"

    - name: Run Loki
      ansible.builtin.include_role:
        name: nanofaas.workbench.common
        tasks_from: container_deploy
      vars:
        wb_image: "{{ loki_image }}"
        wb_port: "{{ instance.config.port }}"
        wb_host: "{{ instance.config.bind | default('127.0.0.1') }}"
        # A replaced file is a new inode under the single-file bind mount: restart to pick it up.
        wb_restart: "{{ loki_config.changed }}"
        wb_ports:
          - "{{ instance.config.bind | default('127.0.0.1') }}:{{ instance.config.port }}:3100"
        wb_command:
          - -config.file=/etc/loki/loki.yaml
        wb_volumes:
          - "/tmp/wb-{{ instance.name }}/loki.yaml:/etc/loki/loki.yaml:ro"
          - "{{ instance.config.data_dir }}:/loki"
