---
- name: Check the container form
  ansible.builtin.include_role:
    name: nanofaas.workbench.common
    tasks_from: pod_unsupported
  when: (instance.form | default('container')) == 'pod'

- name: Run Loki (container form)
  when: (instance.form | default('container')) == 'container'
  block:
    - name: Create the config dir
      ansible.builtin.file:
        path: "/tmp/wb-{{ instance.name }}"
        state: directory
        mode: "0755"

    - name: Place the config file
      ansible.builtin.copy:
        src: "{{ instance.config.config_file | default('loki.yaml') }}"
        dest: "/tmp/wb-{{ instance.name }}/loki.yaml"
        mode: "0644"

    # ponytail: 0777 because Loki runs as uid 10001; the caller still owns the path.
    - name: Create the data dir
      ansible.builtin.file:
        path: "{{ instance.config.data_dir }}"
        state: directory
        mode: "0777"

    - name: Run Loki
      ansible.builtin.include_role:
        name: nanofaas.workbench.common
        tasks_from: container_deploy
      vars:
        wb_image: "{{ loki_image }}"
        wb_port: "{{ instance.config.port }}"
        wb_host: "{{ instance.config.bind | default('127.0.0.1') }}"
        wb_ports:
          - "{{ instance.config.bind | default('127.0.0.1') }}:{{ instance.config.port }}:3100"
        wb_command:
          - -config.file=/etc/loki/loki.yaml
        wb_volumes:
          - "/tmp/wb-{{ instance.name }}/loki.yaml:/etc/loki/loki.yaml:ro"
          - "{{ instance.config.data_dir }}:/loki"
