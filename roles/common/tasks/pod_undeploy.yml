---
# Inputs: instance. Uninstalling a missing release is success.
- name: Uninstall the release
  kubernetes.core.helm:
    name: "wb-{{ instance.name }}"
    release_namespace: "{{ instance.config.namespace | default('default') }}"
    kubeconfig: "{{ instance.config.kubeconfig | default(omit) }}"
    state: absent
    wait: true

# The chart copy and any rendered config files: pod_deploy's scratch dir.
- name: Remove the scratch dir
  ansible.builtin.file:
    path: "/tmp/wb-{{ instance.name }}"
    state: absent
