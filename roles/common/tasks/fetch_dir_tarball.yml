---
# Inputs: instance, collect_dir, wb_src_dir (on the target host), wb_archive (file name in
# <collect_dir>/<instance>/). A throwaway container (root inside, no network) archives the
# directory, so files a component wrote as another uid or with mode 0600 are read without
# become; the tarball is handed to the connection user, fetched, and the scratch dir removed.
- name: Look up the connection user
  ansible.builtin.include_role:
    name: nanofaas.workbench.common
    tasks_from: caller_ids

# Docker would create a missing bind-mount source, root-owned and empty.
- name: Look the source directory up
  ansible.builtin.stat:
    path: "{{ wb_src_dir }}"
  register: common_src

- name: Refuse a missing source directory
  ansible.builtin.fail:
    msg: "{{ wb_src_dir }} does not exist on {{ inventory_hostname }}; nothing to collect"
  when: not common_src.stat.exists

- name: Make a scratch dir
  ansible.builtin.tempfile:
    state: directory
    prefix: "wb-{{ instance.name }}-"
  register: common_scratch

- name: Archive, fetch and clean up
  block:
    - name: Archive the directory in a container
      community.docker.docker_container:
        # Underscores are not valid in instance names, so no instance's container can be this one.
        name: "wb_{{ instance.name }}_collect"
        image: "{{ common_probe_image }}"
        state: started
        recreate: true
        detach: false
        cleanup: true
        network_mode: none
        user: "0:0"
        volumes:
          - "{{ wb_src_dir }}:/src:ro"
          - "{{ common_scratch.path }}:/out"
        # busybox tar exits 1 both when a file changed or vanished while read (the archive is
        # still valid) and on fatal errors (it is truncated): non-zero counts only when the
        # archive lists cleanly.
        command:
          - sh
          - -c
          - >-
            tar czf /out/{{ wb_archive }} -C /src . 2>/tmp/tar.err; rc=$?;
            if [ "$rc" -ne 0 ] && ! tar tzf /out/{{ wb_archive }} >/dev/null 2>&1;
            then cat /tmp/tar.err >&2; exit 1; fi;
            chown {{ common_caller_ids }} /out/{{ wb_archive }}

    - name: Fetch the tarball
      ansible.builtin.fetch:
        src: "{{ common_scratch.path }}/{{ wb_archive }}"
        dest: "{{ collect_dir }}/{{ instance.name }}/{{ wb_archive }}"
        flat: true

  always:
    - name: Remove the scratch dir
      ansible.builtin.file:
        path: "{{ common_scratch.path }}"
        state: absent
