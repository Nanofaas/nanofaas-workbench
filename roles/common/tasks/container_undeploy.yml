---
- name: Look the container up
  community.docker.docker_container_info:
    name: "wb-{{ instance.name }}"
  register: common_found

- name: Remove it when it carries the instance label
  community.docker.docker_container:
    name: "wb-{{ instance.name }}"
    state: absent
    force_kill: true
  when:
    - common_found.exists
    - common_found.container.Config.Labels['nanofaas.workbench/instance'] | default('') == instance.name
