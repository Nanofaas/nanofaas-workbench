---
- name: Look the container up
  community.docker.docker_container_info:
    name: "wb-{{ instance.name }}"
  register: common_found

- name: Remove it when it carries the instance label
  community.docker.docker_container:
    name: "wb-{{ instance.name }}"
    state: absent
    # wb_graceful: SIGTERM and a 10 s grace instead of an immediate kill.
    force_kill: "{{ not (wb_graceful | default(false)) }}"
    stop_timeout: 10
  when:
    - common_found.exists
    - (common_found.container.Config.Labels | default({})).get('nanofaas.workbench/instance', '') == instance.name
