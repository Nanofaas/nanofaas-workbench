---
- name: Work out the command line
  ansible.builtin.set_fact:
    cadvisor_command:
      - --docker_only=true
      - --store_container_labels=true
      - "--housekeeping_interval={{ instance.config.housekeeping_interval | default('5s') }}"

- name: Run cAdvisor (pod form)
  when: (instance.form | default('container')) == 'pod'
  ansible.builtin.include_role:
    name: nanofaas.workbench.common
    tasks_from: pod_deploy
  vars:
    wb_key: cadvisor
    wb_values:
      image: "{{ cadvisor_image }}"
      args: "{{ cadvisor_command }}"
      port: "{{ instance.config.port | default(8080) }}"
      # One instance per node, as in the container form.
      node_name: "{{ instance.config.node_name }}"

- name: Run cAdvisor (container form)
  ansible.builtin.include_role:
    name: nanofaas.workbench.common
    tasks_from: container_deploy
  vars:
    wb_image: "{{ cadvisor_image }}"
    wb_port: "{{ instance.config.port | default(8080) }}"
    wb_host: "{{ instance.config.bind | default('127.0.0.1') }}"
    wb_ports:
      - "{{ instance.config.bind | default('127.0.0.1') }}:{{ instance.config.port | default(8080) }}:8080"
    wb_command: "{{ cadvisor_command }}"
    wb_volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker with the containerd image store: cAdvisor's docker factory needs containerd.
      - /run/containerd:/run/containerd:ro
  when: (instance.form | default('container')) == 'container'
