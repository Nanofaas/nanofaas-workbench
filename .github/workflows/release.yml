name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --locked --all-groups
      - id: check
        name: Tag, galaxy.yml and the supervisor image tag name one version
        run: |
          version=$(uv run --locked python -c 'import yaml; print(yaml.safe_load(open("galaxy.yml"))["version"])')
          [ "$GITHUB_REF_NAME" = "v$version" ] \
            || { echo "tag $GITHUB_REF_NAME != v$version (galaxy.yml)"; exit 1; }
          grep -Fqx "supervisor_image: ghcr.io/nanofaas/workbench-supervisor:$version" \
            roles/supervisor/defaults/main.yml \
            || { echo "roles/supervisor/defaults/main.yml does not name $version"; exit 1; }
          grep -Fqx "version: $version" chart/Chart.yaml \
            && grep -Fqx "appVersion: \"$version\"" chart/Chart.yaml \
            || { echo "chart/Chart.yaml version/appVersion is not $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: images/supervisor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nanofaas/workbench-supervisor:${{ needs.verify.outputs.version }}

  release:
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --locked --all-groups
      - run: uv run --locked ansible-galaxy collection build . --output-path dist
      - name: GitHub Release with the tarball and the image digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          tarball="dist/nanofaas-workbench-$VERSION.tar.gz"
          notes="Supervisor image: ghcr.io/nanofaas/workbench-supervisor:$VERSION@$DIGEST"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$tarball" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "$tarball" \
              --title "$GITHUB_REF_NAME" --notes "$notes"
          fi
