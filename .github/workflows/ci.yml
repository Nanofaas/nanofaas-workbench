name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4
      - run: uv sync --locked --all-groups
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked basedpyright
      - run: uv run --locked bandit -c pyproject.toml -r supervisor
        if: hashFiles('supervisor/**/*.py') != ''
      - run: uv run --locked ansible-lint
      - name: Install collection dependencies
        run: |
          uv run --locked python - <<'PY' > /tmp/requirements.yml
          import yaml
          deps = yaml.safe_load(open("galaxy.yml"))["dependencies"]
          print(yaml.safe_dump({"collections": [{"name": n, "version": v} for n, v in deps.items()]}))
          PY
          uv run --locked ansible-galaxy collection install -r /tmp/requirements.yml
      - name: Build the supervisor image (not pushed)
        run: docker build -f images/supervisor/Dockerfile -t workbench-supervisor:ci .
      # --cov applies fail_under from [tool.coverage.report] to the supervisor.
      - run: uv run --locked pytest -q --cov -m "not kind"
      # As nanolab consumes it: install from git, run a playbook by absolute path.
      - name: Smoke-test the consumer install path
        run: |
          tmp=$(mktemp -d)
          # Only this path: the collection and its Galaxy dependencies land in it.
          export ANSIBLE_COLLECTIONS_PATH="$tmp"
          uv run --locked ansible-galaxy collection install "git+file://$PWD,HEAD" -p "$tmp"
          echo '{"instances": [{"name": "smoke-ne", "component": "node-exporter", "config": {"port": 9109}}]}' > "$tmp/vars.json"
          pb="$tmp/ansible_collections/nanofaas/workbench/playbooks"
          uv run --locked ansible-playbook -i localhost, -e "workbench_vars=$tmp/vars.json" "$pb/deploy.yml"
          uv run --locked ansible-playbook -i localhost, -e "workbench_vars=$tmp/vars.json" "$pb/undeploy.yml"

  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4
      # The test creates and deletes its own cluster (wb-test); the action only installs kind.
      - uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          version: v0.25.0
          install_only: true
      - run: uv sync --locked --all-groups
      - name: Install collection dependencies
        run: |
          uv run --locked python - <<'PY' > /tmp/requirements.yml
          import yaml
          deps = yaml.safe_load(open("galaxy.yml"))["dependencies"]
          print(yaml.safe_dump({"collections": [{"name": n, "version": v} for n, v in deps.items()]}))
          PY
          uv run --locked ansible-galaxy collection install -r /tmp/requirements.yml
      - name: Verify pod Services and loadgen on two kind nodes
        run: uv run --locked pytest -q -m kind tests/integration/test_pod_form.py
