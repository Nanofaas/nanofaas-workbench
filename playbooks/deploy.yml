---
# This machine runs in place, with the interpreter that has the Docker SDK;
# every other host keeps whatever its inventory sets.
- name: Workbench deploy on this machine
  ansible.builtin.import_playbook: run.yml
  vars:
    wb_action: deploy
    wb_hosts: "all:&localhost:&127.0.0.1"
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Workbench deploy on other hosts
  ansible.builtin.import_playbook: run.yml
  vars:
    wb_action: deploy
    wb_hosts: "all:!localhost:!127.0.0.1"
