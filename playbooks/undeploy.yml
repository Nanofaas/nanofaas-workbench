---
- name: Workbench undeploy
  hosts: all
  gather_facts: false
  vars_files:
    - vars/connection.yml
    - "{{ workbench_vars }}"
  tasks:
    - name: Validate the host vars file
      ansible.builtin.import_tasks: tasks/validate_vars.yml

    - name: Run undeploy for each instance
      ansible.builtin.include_role:
        name: "nanofaas.workbench.{{ item.component | replace('-', '_') }}"
        tasks_from: undeploy
      vars:
        instance: "{{ item }}"
      loop: "{{ instances | reverse | list }}"
      loop_control:
        label: "{{ item.name }}"
