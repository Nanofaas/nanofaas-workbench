{{- with .Values.cadvisor }}{{ if .enabled }}
{{- $ctx := dict "root" $ "component" "cadvisor" }}
{{ include "wb.service" (merge (dict "port" .port "target" 8080) $ctx) }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "wb.name" $ }}
  labels: {{- include "wb.labels" $ctx | nindent 4 }}
spec:
  nodeName: {{ required "cadvisor.node_name is required" .node_name | quote }}
  hostPID: true
  containers:
    - name: cadvisor
      image: {{ required "cadvisor.image is required" .image | quote }}
      args: {{- toYaml .args | nindent 8 }}
      ports:
        - containerPort: 8080
      readinessProbe:
        tcpSocket: {port: 8080}
      volumeMounts:
        - {name: rootfs, mountPath: /rootfs, readOnly: true}
        - {name: sys, mountPath: /sys, readOnly: true}
        - {name: docker, mountPath: /var/lib/docker, readOnly: true}
        - {name: docker-sock, mountPath: /var/run/docker.sock, readOnly: true}
        - {name: containerd, mountPath: /run/containerd, readOnly: true}
      {{- include "wb.resources" .resources | nindent 6 }}
  volumes:
    - {name: rootfs, hostPath: {path: /, type: Directory}}
    - {name: sys, hostPath: {path: /sys, type: Directory}}
    - {name: docker, hostPath: {path: /var/lib/docker, type: Directory}}
    - {name: docker-sock, hostPath: {path: /var/run/docker.sock, type: Socket}}
    - {name: containerd, hostPath: {path: /run/containerd, type: Directory}}
{{- end }}{{ end }}
