{{- with .Values.loki }}{{ if .enabled }}
{{- $ctx := dict "root" $ "component" "loki" }}
{{ include "wb.configmap" (merge (dict "files" .files) $ctx) }}
---
{{ include "wb.service" (merge (dict "port" .port "target" 3100) $ctx) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wb.name" $ }}
  labels: {{- include "wb.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      nanofaas.workbench/instance: {{ $.Values.instance | quote }}
  template:
    metadata:
      labels: {{- include "wb.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .files | sha256sum }}
    spec:
      containers:
        - name: loki
          image: {{ required "loki.image is required" .image | quote }}
          args: {{- toYaml .args | nindent 12 }}
          ports:
            - containerPort: 3100
          readinessProbe:
            tcpSocket: {port: 3100}
          volumeMounts:
            {{- include "wb.filemounts" (dict "files" .files "dir" "/etc/loki") | nindent 12 }}
            - {name: data, mountPath: /loki}
          {{- include "wb.resources" .resources | nindent 10 }}
      volumes:
        - name: config
          configMap: {name: {{ include "wb.name" $ }}}
        - name: data
          emptyDir: {}
{{- end }}{{ end }}
